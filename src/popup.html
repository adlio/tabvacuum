<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TabVacuum</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header class="brand">
    <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 4h11a2 2 0 0 1 2 2v11M4 8h10a2 2 0 0 1 2 2v9H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2Z"/><path d="M2 12h14"/></svg>
    <span class="logo">TabVacuum</span>
  </header>
  <main>
    <ul class="actions search-actions" aria-label="Search">
      <li>
        <button id="btn-search" class="search-action">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
          <span class="action-copy"><span class="action-title">Search tabs</span><span class="action-detail">Find a tab. Pick up where you left off.</span></span>
          <span id="search-shortcut" class="shortcut" data-shortcut="search-tabs" role="img" hidden></span>
        </button>
      </li>
    </ul>
    <section class="action-group" aria-labelledby="organize-label">
      <h2 id="organize-label">Organize</h2>
      <ul class="actions">
        <li><button id="btn-merge">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="8" width="13" height="13" rx="2"/><path d="M8 5V3h13v13h-2M3 12h13"/></svg>
          <span>Merge windows</span><span class="shortcut" data-shortcut="merge-windows" role="img" hidden></span>
        </button></li>
        <li><button id="btn-sort" aria-expanded="false" aria-controls="sort-options">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h15M4 12h10M4 18h5m9-5v8m-3-3 3 3 3-3"/></svg>
          <span>Sort tabs</span>
          <svg class="chevron" viewBox="0 0 16 16" aria-hidden="true" focusable="false"><path d="m6 4 4 4-4 4"/></svg>
        </button>
          <div id="sort-options" class="sort-options" hidden>
            <button data-criteria="url" data-direction="asc">URL <span>A → Z</span></button>
            <button data-criteria="url" data-direction="desc">URL <span>Z → A</span></button>
            <button data-criteria="title" data-direction="asc">Title <span>A → Z</span></button>
            <button data-criteria="title" data-direction="desc">Title <span>Z → A</span></button>
            <button data-criteria="lastAccessed" data-direction="desc">Last accessed</button>
            <button data-criteria="visitCount" data-direction="desc">Most visited</button>
            <button data-criteria="frecency" data-direction="desc">Frequent &amp; recent</button>
          </div>
        </li>
      </ul>
    </section>
    <section class="action-group" aria-labelledby="cleanup-label">
      <h2 id="cleanup-label">Clean up</h2>
      <ul class="actions">
        <li><button id="btn-dupes">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="7" width="13" height="14" rx="2"/><path d="M8 4V3h13v13h-2M7 12l5 5m0-5-5 5"/></svg>
          <span>Close duplicates</span><span class="shortcut" data-shortcut="close-duplicates" role="img" hidden></span>
        </button></li>
        <li><button id="btn-stale">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
          <span>Close stale tabs</span><span class="shortcut" data-shortcut="close-stale" role="img" hidden></span>
        </button></li>
        <li><button id="btn-blank">
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 8h18m-12 6h6"/></svg>
          <span>Close blank tabs</span><span class="shortcut" data-shortcut="close-blank" role="img" hidden></span>
        </button></li>
      </ul>
    </section>
  </main>
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <script src="browser-polyfill.js"></script>
  <script type="module" src="popup.js"></script>
</body>
</html>
